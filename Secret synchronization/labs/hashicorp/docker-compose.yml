version: "3.8"

# Local HashiCorp Vault in dev mode for lab testing.
# Data is NOT persisted between restarts (dev mode).
# Do NOT use in production.

services:
  vault:
    image: hashicorp/vault:latest
    container_name: britive-lab-vault
    ports:
      - "8200:8200"
    environment:
      # Fixed root token so setup.sh can authenticate without
      # parsing the container startup logs.
      VAULT_DEV_ROOT_TOKEN_ID: "britive-lab-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      # Suppress the UI redirect warning
      VAULT_LOCAL_CONFIG: '{"ui": true}'
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
